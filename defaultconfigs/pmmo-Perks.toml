# Project MMO — перки событий (СЕРВЕРНЫЙ конфиг Forge) Арканополиса.
# Отличие от стандартного файла pmmo: из события SKILL_UP убраны все перки
# pmmo:fireworks — фейерверков за каждое повышение навыка больше НЕТ.
# Остальные перки (атрибуты, скорость копания, прыжки и пр.) — стандартные,
# как в оригинальном pmmo-Perks.toml. Структура сверена с исходниками
# Project MMO 1.20.1-1.7.x (PerksConfig.generateDefaults).
#
# МЕСТО ФАЙЛА ВАЖНО: PerksConfig — серверный конфиг (ModConfig.Type.SERVER),
# игра читает его из <мир>/serverconfig/pmmo-Perks.toml. В папке config/
# он игнорируется (поэтому до 0.9.4 салюты не отключались). Эта копия лежит
# в defaultconfigs/ — Forge сам копирует её в serverconfig НОВЫХ миров.
# Для уже существующего мира один раз скопируйте файл вручную в
# saves/<ваш мир>/serverconfig/pmmo-Perks.toml (на сервере — в папку мира),
# заменив сгенерированный.

[Perks]

[Perks.For_Event]

